# Ablation Step 5: Joint Detection + Token Classification Head (Hypothesis H4)
_base_: "configs/base_training.yaml"
step_name: "step5_token_head"
hypothesis: "H4 (Redaction): Joint detection + token classification head allows sentence-level redaction"
normalize: true
chunking: true
chunk_size: 256
chunk_stride: 192
pair_input: true
max_task_length: 64
max_chunk_length: 256
total_max_length: 323
pooling_method: "token_gated"
top_k: 2
counterfactual_pairs: true
use_token_head: true
use_type_head: false
obf_augment: false
lambda_tok: 0.25
lambda_type: 0.0
output_dir: "checkpoints/step5_token_head"
results_dir: "results/step5_token_head"
